name: bedrock-agent
on:
  push:
    paths:
      - "bedrock-agent/**"
      - ".github/workflows/bedrock-agent.yml"
  pull_request:
    paths:
      - "bedrock-agent/**"
      - ".github/workflows/bedrock-agent.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bedrock-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
